<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>pistols.wtf — Aesthetic Biolinks & Digital Identity</title>
    <meta name="description" content="Create aesthetic biolinks, showcase your content, and connect with your audience. Claim your unique handle on pistols.wtf." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Tailwind CSS with custom styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#990026',
                50: '#ffebf0',
                100: '#ffd6df',
                200: '#ffb3c2',
                300: '#ff8099',
                400: '#e6194c',
                500: '#990026',
                600: '#800020',
                700: '#5c0017',
                800: '#400010',
                900: '#26000a',
              },
              dark: {
                bg: '#060608',
                surface: '#0d0d10',
                card: '#121216',
                border: '#24141a',
                muted: '#888888',
              }
            },
            fontFamily: {
              sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 3s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                '0%': { filter: 'drop-shadow(0 0 15px rgba(153, 0, 38, 0.25))' },
                '100%': { filter: 'drop-shadow(0 0 35px rgba(153, 0, 38, 0.6))' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #060608;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }
      
      /* Custom glowing scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f1015;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #990026;
      }

      .glass-card {
        background: rgba(18, 10, 14, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(153, 0, 38, 0.2);
      }

      .glass-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(153, 0, 38, 0.5);
        box-shadow: 0 0 30px rgba(153, 0, 38, 0.25);
      }

      .crimson-gradient-text {
        background: linear-gradient(135deg, #FFFFFF 0%, #ff4d6d 50%, #990026 85%, #5c0017 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .crimson-radial-glow {
        background: radial-gradient(circle at 50% 30%, rgba(153, 0, 38, 0.22) 0%, rgba(64, 0, 16, 0.1) 45%, rgba(6, 6, 8, 0) 70%);
      }

      /* Backwards compatibility classes */
      .orange-gradient-text {
        background: linear-gradient(135deg, #FFFFFF 0%, #ff4d6d 50%, #990026 85%, #5c0017 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .orange-radial-glow {
        background: radial-gradient(circle at 50% 30%, rgba(153, 0, 38, 0.22) 0%, rgba(64, 0, 16, 0.1) 45%, rgba(6, 6, 8, 0) 70%);
      }

      /* iOS-style spring animation physics */
      @keyframes iosMenuIn {
        0% {
          opacity: 0;
          transform: scale(0.93) translateY(-12px);
          filter: blur(6px);
        }
        65% {
          transform: scale(1.012) translateY(1px);
          filter: blur(0px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0px);
        }
      }

      @keyframes iosFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .ios-menu-enter {
        animation: iosMenuIn 360ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: top center;
        will-change: transform, opacity, filter;
      }

      .ios-backdrop-enter {
        animation: iosFadeIn 250ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .ios-item-1 { animation: iosMenuIn 380ms cubic-bezier(0.16, 1, 0.3, 1) 30ms backwards; }
      .ios-item-2 { animation: iosMenuIn 400ms cubic-bezier(0.16, 1, 0.3, 1) 60ms backwards; }
      .ios-item-3 { animation: iosMenuIn 420ms cubic-bezier(0.16, 1, 0.3, 1) 90ms backwards; }
      .ios-item-4 { animation: iosMenuIn 440ms cubic-bezier(0.16, 1, 0.3, 1) 120ms backwards; }
    </style>
  </head>
  <body class="bg-[#060608] text-white selection:bg-[#990026] selection:text-white">
    <!-- Hidden SVG filter for the guns.lol interference / noise effect -->
    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="name-filter" x="-10%" y="-20%" width="120%" height="140%">
          <feTurbulence id="name-turb" type="turbulence" baseFrequency="0.008 1.1" numOctaves="1" seed="1" result="noise" />
          <feDisplacementMap id="name-disp" in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
